<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Araz Məhsullar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    input {
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      min-width: 230px;
      font-size: 14px;
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #444;
    }

    .status {
      margin-bottom: 18px;
      color: #555;
      font-size: 14px;
    }

    .error {
      display: none;
      background: #ffecec;
      color: #c00000;
      padding: 12px 14px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-size: 14px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
      min-height: 175px;
    }

    .product-name {
      font-size: 16px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .price {
      font-size: 24px;
      font-weight: bold;
      color: #e30613;
      margin-bottom: 6px;
    }

    .old-price {
      color: #777;
      text-decoration: line-through;
      margin-bottom: 10px;
      font-size: 15px;
    }

    .discount {
      display: inline-block;
      background: #e30613;
      color: white;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: bold;
    }

    .empty {
      background: white;
      border-radius: 14px;
      padding: 18px;
      color: #555;
    }

    @media (max-width: 600px) {
      body {
        padding: 14px;
      }

      h1 {
        font-size: 23px;
      }

      input,
      button {
        width: 100%;
      }

      .actions {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <h1>Araz Məhsullar</h1>

      <div class="actions">
        <input
          id="searchInput"
          type="text"
          placeholder="Məhsul axtar..."
          oninput="filterProducts()"
        />

        <button onclick="reloadProducts()">
          Yenilə
        </button>
      </div>
    </div>

    <div class="status" id="statusText">Yüklənir...</div>

    <div class="error" id="errorBox"></div>

    <div class="products" id="productsContainer"></div>
  </div>

  <script>
    const SHEET_URL =
      "https://docs.google.com/spreadsheets/d/1xgx2ShmS87dpcq-3rdkaw4UpKxqowhvN7-aHtXUa2oU/gviz/tq?tqx=out:json&gid=0";

    const productsContainer = document.getElementById("productsContainer");
    const statusText = document.getElementById("statusText");
    const errorBox = document.getElementById("errorBox");
    const searchInput = document.getElementById("searchInput");

    let allProducts = [];

    window.google = {
      visualization: {
        Query: {
          setResponse: function (response) {
            handleSheetResponse(response);
          }
        }
      }
    };

    function loadProducts() {
      hideError();
      statusText.textContent = "Google Sheet-dən data oxunur...";

      const oldScript = document.getElementById("sheetScript");

      if (oldScript) {
        oldScript.remove();
      }

      const script = document.createElement("script");
      script.id = "sheetScript";
      script.src = SHEET_URL + "&cacheBust=" + Date.now();

      script.onerror = function () {
        showError("Google Sheet oxunmadı. Bu kompüter/şəbəkə Google Sheet request-ini bloklaya bilər.");
        statusText.textContent = "Data oxunmadı.";
      };

      document.body.appendChild(script);
    }

    function handleSheetResponse(response) {
      try {
        if (!response || response.status !== "ok") {
          showError("Google Sheet cavabında xəta var.");
          statusText.textContent = "Data oxunmadı.";
          return;
        }

        const rows = response.table.rows || [];

        allProducts = rows
          .map(row => {
            return {
              productName: row.c[0] ? row.c[0].v : "",
              price: row.c[1] ? row.c[1].v : "",
              priceFormatted: row.c[1] ? row.c[1].f : "",
              originalPrice: row.c[2] ? row.c[2].v : "",
              originalPriceFormatted: row.c[2] ? row.c[2].f : ""
            };
          })
          .filter(product => product.productName);

        renderProducts(allProducts);

        statusText.textContent = "Məhsul sayı: " + allProducts.length;
      } catch (error) {
        console.error(error);
        showError(error.message);
        statusText.textContent = "Data oxunmadı.";
      }
    }

    function renderProducts(products) {
      productsContainer.innerHTML = "";

      if (!products.length) {
        productsContainer.innerHTML =
          '<div class="empty">Məhsul tapılmadı.</div>';
        return;
      }

      products.forEach(product => {
        const price = toNumber(product.price);
        const originalPrice = toNumber(product.originalPrice);

        let discountHtml = "";

        if (price > 0 && originalPrice > 0 && originalPrice > price) {
          const discount = Math.round(
            ((originalPrice - price) / originalPrice) * 100
          );

          discountHtml = `<div class="discount">-${discount}% endirim</div>`;
        }

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
          <div class="product-name">${escapeHTML(product.productName)}</div>

          <div class="price">
            ${escapeHTML(product.priceFormatted || formatPrice(price))}
          </div>

          ${
            originalPrice > 0
              ? `<div class="old-price">${escapeHTML(product.originalPriceFormatted || formatPrice(originalPrice))}</div>`
              : ""
          }

          ${discountHtml}
        `;

        productsContainer.appendChild(card);
      });
    }

    function filterProducts() {
      const searchText = searchInput.value.toLowerCase().trim();

      if (!searchText) {
        renderProducts(allProducts);
        statusText.textContent = "Məhsul sayı: " + allProducts.length;
        return;
      }

      const filtered = allProducts.filter(product =>
        product.productName.toLowerCase().includes(searchText)
      );

      renderProducts(filtered);
      statusText.textContent = "Axtarış nəticəsi: " + filtered.length + " məhsul";
    }

    function reloadProducts() {
      loadProducts();
    }

    function toNumber(value) {
      if (typeof value === "number") {
        return value;
      }

      if (!value) {
        return 0;
      }

      return Number(
        String(value)
          .replace("₼", "")
          .replace(",", ".")
          .replace(/[^\d.]/g, "")
      ) || 0;
    }

    function formatPrice(value) {
      const number = toNumber(value);

      if (!number) {
        return "";
      }

      return number.toFixed(2) + " ₼";
    }

    function showError(message) {
      errorBox.style.display = "block";
      errorBox.textContent = message;
    }

    function hideError() {
      errorBox.style.display = "none";
      errorBox.textContent = "";
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadProducts();
  </script>
</body>
</html>
